server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Поток событий (SSE): соединение держится часами, сервер шлёт пинг раз в 20 с
    location = /api/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ответ помощника идёт потоком: буферизация склеила бы его в один кусок,
        # а на CPU модель может молчать до первого токена больше минуты
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
