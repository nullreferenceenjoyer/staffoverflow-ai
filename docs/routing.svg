<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#1f2933">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/>
    </marker>
    <style>
      .box  { fill: #f5f7fa; stroke: #9aa5b1; stroke-width: 1.2; }
      .ask  { fill: #fff7e6; stroke: #d4a017; stroke-width: 1.2; }
      .key  { fill: #e8f0fe; stroke: #4a7bd0; stroke-width: 1.4; }
      .ok   { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.4; }
      .idle { fill: #eeeeee; stroke: #9e9e9e; stroke-width: 1.2; }
      .note { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .line { fill: none; stroke: #6b7785; stroke-width: 1.4; }
      .sub  { font-size: 12px; fill: #52606d; }
      .lbl  { font-size: 12px; fill: #52606d; font-style: italic; }
      .head { font-size: 16px; font-weight: 600; }
      .b    { font-weight: 600; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="30" y="30" class="head">1. Тема</text>
  <text x="520" y="30" class="head">2. Исполнитель</text>

  <!-- Тема -->
  <rect x="90" y="50" width="300" height="44" rx="8" class="box"/>
  <text x="240" y="77" text-anchor="middle">Заявка: заголовок и текст</text>
  <path d="M240,94 V122" class="line" marker-end="url(#arrow)"/>

  <rect x="120" y="124" width="240" height="40" rx="20" class="ask"/>
  <text x="240" y="149" text-anchor="middle">Тему указал автор?</text>

  <path d="M160,164 V182 H115 V208" class="line" marker-end="url(#arrow)"/>
  <text x="124" y="198" class="lbl">да</text>
  <path d="M320,164 V182 H345 V208" class="line" marker-end="url(#arrow)"/>
  <text x="354" y="198" class="lbl">нет</text>

  <rect x="30" y="210" width="170" height="54" rx="8" class="box"/>
  <text x="115" y="233" text-anchor="middle">Остаётся как есть</text>
  <text x="115" y="252" text-anchor="middle" class="sub">manual</text>

  <rect x="240" y="210" width="210" height="54" rx="8" class="box"/>
  <text x="345" y="233" text-anchor="middle">Локальная модель</text>
  <text x="345" y="252" text-anchor="middle" class="sub">выбирает код темы · llm</text>
  <path d="M345,264 V290" class="line" marker-end="url(#arrow)"/>

  <rect x="240" y="292" width="210" height="40" rx="20" class="ask"/>
  <text x="345" y="317" text-anchor="middle" font-size="13">Код есть в справочнике?</text>

  <path d="M240,312 H115" class="line"/>
  <text x="200" y="305" class="lbl">да</text>
  <path d="M115,264 V468" class="line" marker-end="url(#arrow)"/>

  <path d="M345,332 V370" class="line" marker-end="url(#arrow)"/>
  <text x="336" y="356" text-anchor="end" class="lbl">нет или модель недоступна</text>

  <rect x="240" y="372" width="210" height="70" rx="8" class="box"/>
  <text x="345" y="395" text-anchor="middle">Ключевые слова · rules</text>
  <text x="345" y="414" text-anchor="middle" class="sub">больше совпадений — та тема</text>
  <text x="345" y="431" text-anchor="middle" class="sub">ни одного — «Прочее»</text>
  <path d="M345,442 V468" class="line" marker-end="url(#arrow)"/>

  <rect x="30" y="470" width="420" height="50" rx="8" class="key"/>
  <text x="240" y="500" text-anchor="middle" class="b">Тема → адресат и срок</text>

  <!-- Переход к исполнителю -->
  <path d="M450,495 H480 V90 H518" class="line" marker-end="url(#arrow)"/>

  <!-- Исполнитель -->
  <rect x="520" y="55" width="220" height="70" rx="8" class="box"/>
  <text x="630" y="78" text-anchor="middle">Кандидаты с этой ролью</text>
  <text x="630" y="97" text-anchor="middle" class="sub">в своём учреждении</text>
  <text x="630" y="113" text-anchor="middle" class="sub">или муниципалитете</text>
  <path d="M630,125 V148" class="line" marker-end="url(#arrow)"/>

  <rect x="540" y="150" width="180" height="40" rx="20" class="ask"/>
  <text x="630" y="175" text-anchor="middle">Кто-то нашёлся?</text>

  <path d="M720,170 H768" class="line" marker-end="url(#arrow)"/>
  <text x="732" y="162" class="lbl">нет</text>

  <rect x="770" y="140" width="170" height="70" rx="8" class="box"/>
  <text x="855" y="163" text-anchor="middle">Адресат выше</text>
  <text x="855" y="182" text-anchor="middle" class="sub">хоз. служба → директор</text>
  <text x="855" y="198" text-anchor="middle" class="sub">→ управление образования</text>

  <path d="M855,140 V44 H630 V53" class="line" marker-end="url(#arrow)"/>
  <text x="870" y="96" class="lbl">ищем</text>
  <text x="870" y="111" class="lbl">снова</text>

  <path d="M855,210 V258" class="line" marker-end="url(#arrow)"/>
  <text x="845" y="238" text-anchor="end" class="lbl">выше некуда</text>

  <rect x="770" y="260" width="170" height="54" rx="8" class="idle"/>
  <text x="855" y="283" text-anchor="middle">Остаётся «Новой»</text>
  <text x="855" y="302" text-anchor="middle" class="sub">назначают вручную</text>

  <path d="M630,190 V258" class="line" marker-end="url(#arrow)"/>
  <text x="640" y="228" class="lbl">да</text>

  <rect x="520" y="260" width="220" height="70" rx="8" class="box"/>
  <text x="630" y="283" text-anchor="middle">Наименее загруженный</text>
  <text x="630" y="302" text-anchor="middle" class="sub">по числу открытых заявок,</text>
  <text x="630" y="318" text-anchor="middle" class="sub">при равенстве — меньший id</text>
  <path d="M630,330 V358" class="line" marker-end="url(#arrow)"/>

  <rect x="520" y="360" width="220" height="54" rx="8" class="ok"/>
  <text x="630" y="383" text-anchor="middle" class="b">«Назначена»</text>
  <text x="630" y="402" text-anchor="middle" class="sub">уведомление со сроком</text>

  <rect x="520" y="440" width="420" height="80" rx="8" class="note"/>
  <text x="538" y="466" class="b">Срок</text>
  <text x="538" y="488" class="sub">аварийная — 4 часа, срочная — 24 часа,</text>
  <text x="538" y="506" class="sub">плановая — по теме, от 2 до 14 дней</text>
</svg>
