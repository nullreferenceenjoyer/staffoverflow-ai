[project]
name = "hr-edu-backend"
version = "0.1.0"
description = "API системы заявок образовательных учреждений"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",  # нужен только первой миграции
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # форма входа и загрузка файлов
    "openpyxl>=3.1",  # импорт из Excel и шаблоны
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() в сигнатурах FastAPI

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # миграции генерирует alembic

[tool.pytest.ini_options]
testpaths = ["tests"]
